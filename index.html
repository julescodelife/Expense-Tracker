<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel = "stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="title">Expense Tracker</h1>
    </header>

    <main>
       <form id="expense-form" class="expense-form">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id= "name" name="name" placeholder="Name" required>
            </div>

            <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" placeholder="Amount"
            step="0.01" min="0.01" required>
            </div>

                <div class="bottom-form-input-button">   
                    <div class="form-group">
                        <label for="category">Category</label>
                            <select name="category" id="category" class="category" required>
                                <option value="" disabled selected>Category</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select> 
                        </div>
                        <button type="submit" id="expense-button">Add Expense</button> 
                </div>

        </form>

        <section class="expense-section">
            <h2 class="list-expense-h2">EXPENSE LIST</h2>

            <ul id="expense-list">
                
            </ul>
        </section>
        
        <section class="expense-section">
            <h2 class="total-expense-h2">TOTAL EXPENSE</h2>
                <div class="total-expense-section">
                    <p id="total-expenses">₱0.00</p>
                    <p id="total-expenses-description">TOTAL SPENT.</p>
                </div>

        </section>

    </main>

<footer>
</footer>

<script src="script.js"></script>
</body>

</html>
